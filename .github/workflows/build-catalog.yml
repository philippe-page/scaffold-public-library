name: Build catalog

on:
  push:
    branches: [main]
    paths:
      - 'library/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build catalog.json
        run: node scripts/build-catalog.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit catalog.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          if git diff --staged --quiet; then
            echo "catalog.json unchanged"
            exit 0
          fi
          git commit -m "chore: update catalog.json [skip ci]"
          git push

      - name: Purge jsDelivr catalog cache
        continue-on-error: true
        run: |
          curl -sS "https://purge.jsdelivr.net/gh/philippe-page/scaffold-public-library@main/catalog.json"
